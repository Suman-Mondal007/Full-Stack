<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        ul{
            margin-top: 0;
            background-color: aquamarine;
            padding: 10px;
        }
        ul li{
            background-color: cornsilk;
            color: blue;
            display: inline-block;
            padding: 10px;
        }
        ul li:hover{
            background-color: black;
            color: white;
            padding-left: 15px;
            transition: 0.8s;
        }
    </style>



</head>
<body>
    <ul>
        <li>Home</li>
        <li>About me</li>
        <li>System</li>
        <li>Contact me</li>
    </ul>
</body>
</html>
