<!DOCTYPE html>
<html>
<head>
    <title>Nested Table Example</title>
</head>
<body>

<table border="1" cellpadding="10">
    <tr>
        <th>Student Name</th>
        <th>Details</th>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>
            <!-- Nested Table -->
            <table border="1" cellpadding="5">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Math</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>Science</td>
                    <td>90</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>Anita</td>
        <td>
            <!-- Nested Table -->
            <table border="1" cellpadding="5">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Math</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td>Science</td>
                    <td>92</td>
                </tr>
            </table>
        </td>
    </tr>

</table>

</body>
</html>
